services:
  app:
    build: .
    image: overtree
    ports:
      # loopback only unless OVERTREE_BIND=0.0.0.0
      - "${OVERTREE_BIND:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - overtree-data:/data
      # compiles start sibling containers on the host's Docker (research R4)
      - /var/run/docker.sock:/var/run/docker.sock
    # group owning the socket; root on Docker Desktop and OrbStack, `stat -c %g /var/run/docker.sock` on Linux
    group_add: ["${DOCKER_GID:-0}"]
    environment:
      TEXLIVE_IMAGE: ${TEXLIVE_IMAGE:-texlive/texlive:latest-medium}
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-20000}
      COMPILE_MEMORY: ${COMPILE_MEMORY:-512m}
      COMPILE_CPUS: ${COMPILE_CPUS:-1}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-50}
      IMPORT_MAX_MB: ${IMPORT_MAX_MB:-200}
      PROJECT_MAX_FILES: ${PROJECT_MAX_FILES:-2000}
      # Clerk sign-in: both keys required (the app exits without them); CLERK_JWT_KEY optional for networkless session checks
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      # comma-separated emails that are always site admins
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # GitHub sync (optional, off unless GITHUB_APP_ID is set; all five together): see specs/012-github-sync/quickstart.md
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    restart: unless-stopped

  # pulls the TeX image on `up` so the first compile doesn't pull inside its timeout; exits at once
  texlive:
    image: ${TEXLIVE_IMAGE:-texlive/texlive:latest-medium}
    command: ["true"]
    restart: "no"

volumes:
  overtree-data:
